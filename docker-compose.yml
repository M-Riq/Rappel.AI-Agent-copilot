# Machine de démonstration uniquement ; inutile pour les modes fake/fichier/json.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rappel
      POSTGRES_PASSWORD: rappel
      POSTGRES_DB: rappel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
