version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: rappel-postgres
    environment:
      POSTGRES_USER: rappel
      POSTGRES_PASSWORD: rappel
      POSTGRES_DB: rappel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: